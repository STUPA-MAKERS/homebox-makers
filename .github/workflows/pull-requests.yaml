name: Pull Request CI

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

on:
  pull_request:
    branches:
      - main
      - vnext

    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'specs/**'
      - 'scripts/check_specs.py'
      - '.github/workflows/partial-backend.yaml'
      - '.github/workflows/partial-frontend.yaml'
      - '.github/workflows/e2e-partial.yaml'
      - '.github/workflows/pull-requests.yaml'

jobs:
  backend-tests:
    name: "Backend Server Tests"
    uses: ./.github/workflows/partial-backend.yaml

  frontend-tests:
    name: "Frontend Tests"
    uses: ./.github/workflows/partial-frontend.yaml

  e2e-tests:
    name: "End-to-End Playwright Tests"
    uses: ./.github/workflows/e2e-partial.yaml

  specs:
    name: "Specs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          # `implementation` paths in the specs point into the ui-kit submodule.
          submodules: recursive
      # Checks the format of every spec, the index and every § reference in the code.
      - run: python3 scripts/check_specs.py
