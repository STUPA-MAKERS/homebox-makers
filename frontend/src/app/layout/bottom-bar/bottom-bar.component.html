<nav class="bb" [attr.aria-label]="'nav.main' | t">
  <ng-template #entry let-item>
    <a
      class="bb__item"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <span class="bb__ind"><app-icon [name]="item.icon" [size]="22" /></span>
      <span class="bb__label">{{ item.labelKey | t }}</span>
    </a>
  </ng-template>
  @for (item of barStart(); track item.key) {
    <ng-container *ngTemplateOutlet="entry; context: { $implicit: item }" />
  }
  @if (mockScan()) {
    <a class="bb__scan" routerLink="/mockups/scanner" aria-label="Scannen">
      <app-icon name="scan" [size]="26" />
    </a>
  }
  @for (item of barEnd(); track item.key) {
    <ng-container *ngTemplateOutlet="entry; context: { $implicit: item }" />
  }
  <button
    type="button"
    class="bb__item"
    [class.is-active]="moreActive()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="moreOpen()"
    (click)="moreOpen.set(true)"
  >
    <span class="bb__ind"><app-icon name="menu" [size]="22" /></span>
    <span class="bb__label">{{ 'shell.nav.more' | t }}</span>
  </button>
</nav>

<app-side-sheet side="bottom" [heading]="'shell.nav.more' | t" [(open)]="moreOpen">
  <div class="more">
    <div class="more__group">
      <button type="button" class="more__item" (click)="search()">
        <app-icon name="search" [size]="20" />
        <span class="ell more__label">{{ 'nav.search' | t }}</span>
      </button>
      @for (item of moreItems; track item.key) {
        <a
          class="more__item"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          (click)="moreOpen.set(false)"
        >
          <app-icon [name]="item.icon" [size]="20" />
          <span class="ell more__label">{{ item.labelKey | t }}</span>
        </a>
      }
    </div>
    <app-account-menu variant="sheet" (navigated)="moreOpen.set(false)" />
  </div>
</app-side-sheet>
