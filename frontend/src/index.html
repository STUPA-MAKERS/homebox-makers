    <title>Homebox</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Homebox — Inventar für Zuhause, Werkstatt und Verein." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- use-credentials: behind a login proxy (basic auth, SSO) Chrome otherwise fetches the
         manifest without cookies, gets the login page and offers no install. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!-- iOS and iPadOS do not read the icons of the manifest. "Add to Home Screen" takes
         this 180 px icon. It is opaque, because iOS fills a transparent area with black.
         black-translucent lets the page colour reach under the status bar, edge to edge;
         the shell pads its top chrome by env(safe-area-inset-top) (--app-top-safe-area),
         which is 0 in a browser tab. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Homebox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS launch images: without them an installed app starts on a white screen, also in
         the dark theme. One per iPhone screen and theme (portrait); scripts/make-splash.py
